<!DOCTYPE html>
<html class="page-surface-plain" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>New Game Plus | Evolution Trees</title>
    <meta
      name="description"
      content="Interactive evolution path charts for each monster line."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-surface-plain" data-page="monster-guide" data-sidebar="evolution-trees">
    <div class="site-shell">
      <div data-sidebar-root></div>

      <main class="content">
        <header class="topbar">
          <button
            class="menu-button"
            type="button"
            id="menu-button"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            Menu
          </button>
        </header>

        <section class="page-intro">
          <p class="eyebrow">Monster Guide</p>
          <h1>Evolution Trees</h1>
        </section>

        <section class="quick-links">
          <div class="pill-links pill-links--monster">
            <a href="#all" data-tree-line-target="all">All</a>
            <a href="#undead-line" data-tree-line-target="undead-line">Undead</a>
            <a href="#goblin-line" data-tree-line-target="goblin-line">Goblin</a>
            <a href="#fire-elemental-line" data-tree-line-target="fire-elemental-line">Fire</a>
            <a href="#earth-elemental-line" data-tree-line-target="earth-elemental-line">Earth</a>
            <a href="#water-elemental-line" data-tree-line-target="water-elemental-line">Water</a>
            <a href="#wind-elemental-line" data-tree-line-target="wind-elemental-line">Wind</a>
            <a href="#slime-line" data-tree-line-target="slime-line">Slime</a>
            <a href="#phantom-line" data-tree-line-target="phantom-line">Phantom</a>
            <a href="#plant-line" data-tree-line-target="plant-line">Plant</a>
            <a href="#demon-line" data-tree-line-target="demon-line">Demon</a>
            <a href="#wolf-line" data-tree-line-target="wolf-line">Wolf</a>
            <a href="#draconic-line" data-tree-line-target="draconic-line">Draconic</a>
            <a href="#spider-line" data-tree-line-target="spider-line">Spider</a>
            <a href="#fox-line" data-tree-line-target="fox-line">Fox</a>
            <a href="#bird-line" data-tree-line-target="bird-line">Bird</a>
            <a href="#angel-line" data-tree-line-target="angel-line">Angel</a>
            <a href="#rabbit-line" data-tree-line-target="rabbit-line">Rabbit</a>
            <a href="#cat-line" data-tree-line-target="cat-line">Cat</a>
            <a href="#insect-line" data-tree-line-target="insect-line">Insect</a>
            <a href="#equine-line" data-tree-line-target="equine-line">Equine</a>
            <a href="#primate-line" data-tree-line-target="primate-line">Primate</a>
          </div>
        </section>

        <section class="tree-workspace">
          <section class="card tree-chart">
            <div class="tree-chart__header">
              <div>
                <p class="card__label" data-tree-current-title>---</p>
              </div>
              <div class="tree-chart__stats">
                <p class="card__label" data-tree-current-count>0 Paths</p>
              </div>
            </div>

            <div class="tree-chart__content" data-tree-chart-content></div>
          </section>

          <aside class="tree-sidebar">
            <section class="card tree-selection">
              <p class="card__label" data-tree-selection-title>Selected Path</p>
              <p data-tree-selection-copy>
                Click any monster node in the chart to load that route.
              </p>
            </section>
          </aside>
        </section>

        <section class="tree-selected-grid" data-tree-selected-cards></section>
      </main>
    </div>

    <script src="evolution-trees-data.js?v=2026-03-23-1"></script>
    <script src="monster-guide-data.js?v=2026-03-23-4"></script>
    <script src="monster-cards.js?v=2026-03-23-3"></script>
    <script src="formatter.js?v=2026-03-23-2"></script>
    <script src="sidebar.js"></script>
    <script src="script.js"></script>
    <script src="evolution-trees.js"></script>
  </body>
</html>
