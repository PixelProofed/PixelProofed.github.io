    <script>
      (function () {
        function getManaStonesNoteStorageKey(toggle, index) {
          var label = toggle ? toggle.textContent.trim().toLowerCase().replace(/\s+/g, "-") : "";
          return "mana-stones-note:" + (label || String(index));
        }

        function readManaStonesNoteState(toggle, index) {
          try {
            return window.localStorage.getItem(getManaStonesNoteStorageKey(toggle, index));
          } catch (error) {
            return null;
          }
        }

        function writeManaStonesNoteState(toggle, index, expanded) {
          try {
            window.localStorage.setItem(
              getManaStonesNoteStorageKey(toggle, index),
              expanded ? "open" : "closed",
            );
          } catch (error) {
            return;
          }
        }

        function setupManaStonesNotes() {
          var toggles = document.querySelectorAll("[data-mana-stones-note-toggle]");
          var toggleIndex;

          for (toggleIndex = 0; toggleIndex < toggles.length; toggleIndex += 1) {
            (function (toggle, index) {
              var savedState = readManaStonesNoteState(toggle, index);
              var content = toggle.parentNode.querySelector("[data-mana-stones-note-content]");
              var expanded =
                savedState === "open"
                  ? true
                  : savedState === "closed"
                    ? false
                    : index === 0
                      ? true
                      : toggle.getAttribute("aria-expanded") === "true";

              toggle.setAttribute("aria-expanded", expanded ? "true" : "false");

              if (content) {
                content.hidden = !expanded;
              }

              toggle.addEventListener("click", function () {
                var expanded = this.getAttribute("aria-expanded") === "true";
                var content = this.parentNode.querySelector("[data-mana-stones-note-content]");
                var nextExpanded = !expanded;

                this.setAttribute("aria-expanded", nextExpanded ? "true" : "false");

                if (content) {
                  content.hidden = !nextExpanded;
                }

                writeManaStonesNoteState(this, index, nextExpanded);
              });
            })(toggles[toggleIndex], toggleIndex);
          }
        }

        setupManaStonesNotes();

        if (window.siteTextFormatter && window.siteTextFormatter.apply) {
          window.siteTextFormatter.apply(document.body);
        }
      })();
    </script>
