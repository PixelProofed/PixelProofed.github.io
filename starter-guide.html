  <body data-page="starter-guide">

      <main class="content">

          <button

        <section class="page-intro">

              </p>

              <section class="monster-guide-note">
                <button
                  class="monster-guide-note__toggle"
                  type="button"
                  data-starter-note-toggle
                  aria-expanded="true"
                >
                  <span>---</span>
                </button>
                <div class="monster-guide-note__content" data-starter-note-content>
                  <p>
---
                  </p>
                </div>
              </section>

              <section class="monster-guide-note">
                <button
                  class="monster-guide-note__toggle"
                  type="button"
                  data-starter-note-toggle
                  aria-expanded="false"
                >
                  <span>---</span>
                </button>
                <div class="monster-guide-note__content" data-starter-note-content hidden>
                  <p>
---
                  </p>
                </div>
              </section>

              <section class="monster-guide-note">
                <button
                  class="monster-guide-note__toggle"
                  type="button"
                  data-starter-note-toggle
                  aria-expanded="false"
                >
                  <span>---</span>
                </button>
                <div class="monster-guide-note__content" data-starter-note-content hidden>
                  <p>
---
                  </p>
                </div>

          </article>

          <div class="monster-overview-side">

    <script src="formatter.js?v=2026-03-30-1"></script>
    <script src="sidebar.js"></script>
    <script>
      (function () {
        var toggles = document.querySelectorAll("[data-starter-note-toggle]");
        var toggleIndex;

        for (toggleIndex = 0; toggleIndex < toggles.length; toggleIndex += 1) {
          toggles[toggleIndex].addEventListener("click", function () {
            var expanded = this.getAttribute("aria-expanded") === "true";
            var content = this.parentNode.querySelector("[data-starter-note-content]");

            this.setAttribute("aria-expanded", expanded ? "false" : "true");

            if (content) {
              content.hidden = expanded;
            }
          });
        }

        if (window.siteTextFormatter && window.siteTextFormatter.apply) {
          window.siteTextFormatter.apply(document.body);
        }
      })();
    </script>
    <script src="script.js"></script>
  </body>
