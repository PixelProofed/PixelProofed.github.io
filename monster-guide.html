    <script>
      (function () {
        var data = window.monsterGuideData;
        var monsterCardUtils = window.monsterCardUtils || {};
        var textFormatter = window.siteTextFormatter || {};
        var introSection = document.querySelector("[data-monster-intro]");
        var overviewSection = document.querySelector("[data-monster-overview]");
        var detailSection = document.querySelector("[data-monster-detail]");
        var currentLabel = document.querySelector("[data-monster-current-label]");
        var currentTitle = document.querySelector("[data-monster-current-title]");
        var currentSubtext = document.querySelector("[data-monster-current-subtext]");
        var currentCount = document.querySelector("[data-monster-current-count]");
        var monsterCards = document.querySelector("[data-monster-cards]");
        var hashTargets = document.querySelectorAll("[data-hash-target]");

        function getLine(slug) {
          var index;

          if (!data || !data.length) {
            return null;
          }

          for (index = 0; index < data.length; index += 1) {
            if (data[index].slug === slug) {
              return data[index];
            }
          }

          return null;
        }

        function setActiveLink(slug) {
          var index;

          for (index = 0; index < hashTargets.length; index += 1) {
            var link = hashTargets[index];
            link.classList.toggle("is-active", link.dataset.hashTarget === slug);
          }
        }

        function renderLine(line) {
          var markup = "";
          currentTitle.textContent = line.name;
          currentSubtext.textContent = "---";
          currentCount.textContent = line.monsters.length + " Entries";

          var index;

          for (index = 0; index < line.monsters.length; index += 1) {
            var monster = line.monsters[index];
            if (monsterCardUtils.buildMonsterCardMarkup) {
              markup += monsterCardUtils.buildMonsterCardMarkup(monster);
            }
          }

          monsterCards.innerHTML = markup;
          if (textFormatter.apply) {
            textFormatter.apply(detailSection);
          }
        }

        function showOverview() {
          if (!overviewSection || !detailSection || !introSection) {
            return;
          }

          setActiveLink("overview");
          overviewSection.hidden = false;
          overviewSection.style.display = "grid";
          detailSection.hidden = true;
          detailSection.style.display = "none";
        }

        function showLine(slug) {
          var line = getLine(slug);

          if (!line || !overviewSection || !detailSection || !introSection) {
            showOverview();
            return;
          }

          setActiveLink(slug);
          overviewSection.hidden = true;
          overviewSection.style.display = "none";
          detailSection.hidden = false;
          detailSection.style.display = "block";
          renderLine(line);
        }

        function syncFromHash() {
          var slug = window.location.hash.replace(/^#/, "");

          if (!slug || slug === "monster-overview") {
            showOverview();
            return;
          }

          showLine(slug);
        }

        if (!data || !data.length) {
          return;
        }

        var linkIndex;

        for (linkIndex = 0; linkIndex < hashTargets.length; linkIndex += 1) {
          var link = hashTargets[linkIndex];

          link.addEventListener("click", function (event) {
            var slug = this.dataset.hashTarget;
            var isActive = this.classList.contains("is-active");

            event.preventDefault();

            if (slug === "overview") {
              if (window.location.hash) {
                window.location.hash = "monster-overview";
              }
              showOverview();
              return;
            }

            if (isActive) {
              window.location.hash = "monster-overview";
              showOverview();
              return;
            }

            window.location.hash = slug;
            showLine(slug);
          });
        }

        syncFromHash();
        if (textFormatter.apply) {
          textFormatter.apply(document.body);
        }
        window.addEventListener("hashchange", syncFromHash);
      })();
    </script>
    <script src="script.js"></script>
  </body>
