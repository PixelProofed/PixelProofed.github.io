<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pixel Proofed | Monster Guide</title>
    <meta
      name="description"
      content="Reference page for monster evolution lines and non-evolution monsters."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=2026-03-28-2" />
  </head>
  <body data-page="monster-guide">
    <div class="site-shell">
      <div data-sidebar-root></div>

      <main class="content">
        <header class="topbar">
          <button
            class="menu-button"
            type="button"
            id="menu-button"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            Menu
          </button>
        </header>

        <section class="page-intro" data-monster-intro>
          <p class="eyebrow">New Game Plus</p>
          <h1>MONSTER GUIDE</h1>
        </section>

        <section class="monster-search" data-monster-search>
          <div class="monster-search__field">
            <input
              class="monster-search__input"
              type="search"
              id="monster-search-input"
              data-monster-search-input
              placeholder="Type any part of a monster name..."
              aria-label="Search monsters"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
        </section>

        <section class="quick-links">
          <div class="pill-links pill-links--monster">
            <a href="#undead-line" data-hash-target="undead-line">Undead</a>
            <a href="#goblin-line" data-hash-target="goblin-line">Goblin</a>
            <a href="#elemental-line" data-hash-target="elemental-line">Elemental</a>
            <a href="#slime-line" data-hash-target="slime-line">Slime</a>
            <a href="#phantom-line" data-hash-target="phantom-line">Phantom</a>
            <a href="#plant-line" data-hash-target="plant-line">Plant</a>
            <a href="#demon-line" data-hash-target="demon-line">Demon</a>
            <a href="#wolf-line" data-hash-target="wolf-line">Wolf</a>
            <a href="#draconic-line" data-hash-target="draconic-line">Draconic</a>
            <a href="#spider-line" data-hash-target="spider-line">Spider</a>
            <a href="#fox-line" data-hash-target="fox-line">Fox</a>
            <a href="#bird-line" data-hash-target="bird-line">Bird</a>
            <a href="#angel-line" data-hash-target="angel-line">Angel</a>
            <a href="#rabbit-line" data-hash-target="rabbit-line">Rabbit</a>
            <a href="#cat-line" data-hash-target="cat-line">Feline</a>
            <a href="#insect-line" data-hash-target="insect-line">Insect</a>
            <a href="#equine-line" data-hash-target="equine-line">Equine</a>
            <a href="#primate-line" data-hash-target="primate-line">Primate</a>
            <a href="#non-evo-monsters" data-hash-target="non-evo-monsters">Non-Evo</a>
          </div>
        </section>

        <section class="monster-overview-grid" data-monster-overview>
          <article class="card monster-overview-card monster-overview-card--lead">
            <p class="card__label">About Monsters</p>
            <p>
---
            </p>
          </article>

          <article class="card monster-stat-card">
            <p class="card__label">Evolution Lines</p>
            <p>---</p>
            <a class="text-link" href="evolution-trees.html">Open evolution trees</a>
          </article>

          <article class="card monster-stat-card">
            <p class="card__label">In-Progress</p>
            <p>---</p>
          </article>

          <article class="card monster-stat-card">
            <p class="card__label">Updates</p>
            <p>---</p>
          </article>
        </section>

        <section class="monster-detail" data-monster-detail hidden>
          <article class="card monster-line-hero">
            <div class="monster-line-hero__copy">
              <h2 data-monster-current-title>---</h2>
              <p class="monster-line-hero__text" data-monster-current-subtext>
                ---
              </p>
            </div>
            <div class="monster-line-hero__stats">
              <span class="monster-count-pill" data-monster-current-count>0 Entries</span>
            </div>
          </article>

          <section class="monster-card-grid" data-monster-cards></section>
        </section>
      </main>
    </div>

    <script src="evolution-trees-data.js?v=2026-03-23-1"></script>
    <script src="monster-guide-data.js?v=2026-03-24-3"></script>
    <script src="monster-cards.js?v=2026-03-23-3"></script>
    <script src="formatter.js?v=2026-03-23-2"></script>
    <script src="sidebar.js"></script>
    <script>
      (function () {
        var data = window.monsterGuideData;
        var monsterCardUtils = window.monsterCardUtils || {};
        var textFormatter = window.siteTextFormatter || {};
        var introSection = document.querySelector("[data-monster-intro]");
        var overviewSection = document.querySelector("[data-monster-overview]");
        var detailSection = document.querySelector("[data-monster-detail]");
        var searchSection = document.querySelector("[data-monster-search]");
        var searchInput = document.querySelector("[data-monster-search-input]");
        var lineHero = detailSection ? detailSection.querySelector(".monster-line-hero") : null;
        var currentLabel = document.querySelector("[data-monster-current-label]");
        var currentTitle = document.querySelector("[data-monster-current-title]");
        var currentSubtext = document.querySelector("[data-monster-current-subtext]");
        var currentCount = document.querySelector("[data-monster-current-count]");
        var monsterCards = document.querySelector("[data-monster-cards]");
        var hashTargets = document.querySelectorAll("[data-hash-target]");

        function normalizeSearchValue(value) {
          return String(value || "").trim().toLowerCase();
        }

        function getLine(slug) {
          var index;

          if (!data || !data.length) {
            return null;
          }

          for (index = 0; index < data.length; index += 1) {
            if (data[index].slug === slug) {
              return data[index];
            }
          }

          return null;
        }

        function getAllMonsters() {
          var monsters = [];
          var lineIndex;
          var monsterIndex;

          if (!data || !data.length) {
            return monsters;
          }

          for (lineIndex = 0; lineIndex < data.length; lineIndex += 1) {
            var line = data[lineIndex];

            for (monsterIndex = 0; monsterIndex < line.monsters.length; monsterIndex += 1) {
              monsters.push(line.monsters[monsterIndex]);
            }
          }

          return monsters;
        }

        function setActiveLink(slug) {
          var index;

          for (index = 0; index < hashTargets.length; index += 1) {
            var link = hashTargets[index];
            link.classList.toggle("is-active", link.dataset.hashTarget === slug);
          }
        }

        function renderMonsterList(monsters) {
          var markup = "";
          var index;

          for (index = 0; index < monsters.length; index += 1) {
            if (monsterCardUtils.buildMonsterCardMarkup) {
              markup += monsterCardUtils.buildMonsterCardMarkup(monsters[index]);
            }
          }

          monsterCards.innerHTML = markup;
          if (textFormatter.apply) {
            textFormatter.apply(detailSection);
          }
        }

        function renderLine(line) {
          if (lineHero) {
            lineHero.hidden = false;
            lineHero.style.display = "";
          }
          currentTitle.textContent = line.name;
          currentSubtext.textContent = "---";
          currentCount.textContent = line.monsters.length + " Entries";
          renderMonsterList(line.monsters);
        }

        function renderSearchResults(query) {
          var normalizedQuery = normalizeSearchValue(query);
          var matches = getAllMonsters().filter(function (monster) {
            return normalizeSearchValue(monster.name).indexOf(normalizedQuery) !== -1;
          });

          setActiveLink("");
          overviewSection.hidden = true;
          overviewSection.style.display = "none";
          detailSection.hidden = false;
          detailSection.style.display = "block";
          if (lineHero) {
            lineHero.hidden = true;
            lineHero.style.display = "none";
          }
          currentTitle.textContent = "Search Results";
          currentSubtext.textContent = normalizedQuery
            ? 'Showing monsters matching "' + query.trim() + '".'
            : "---";
          currentCount.textContent = matches.length + (matches.length === 1 ? " Match" : " Matches");
          renderMonsterList(matches);
        }

        function showOverview() {
          if (!overviewSection || !detailSection || !introSection) {
            return;
          }

          if (lineHero) {
            lineHero.hidden = false;
            lineHero.style.display = "";
          }
          setActiveLink("overview");
          overviewSection.hidden = false;
          overviewSection.style.display = "grid";
          detailSection.hidden = true;
          detailSection.style.display = "none";
        }

        function showLine(slug) {
          var line = getLine(slug);

          if (!line || !overviewSection || !detailSection || !introSection) {
            showOverview();
            return;
          }

          setActiveLink(slug);
          overviewSection.hidden = true;
          overviewSection.style.display = "none";
          detailSection.hidden = false;
          detailSection.style.display = "block";
          renderLine(line);
        }

        function syncFromHash() {
          var slug = window.location.hash.replace(/^#/, "");
          var searchValue = searchInput ? normalizeSearchValue(searchInput.value) : "";

          if (searchValue) {
            renderSearchResults(searchInput.value);
            return;
          }

          if (!slug || slug === "monster-overview") {
            showOverview();
            return;
          }

          showLine(slug);
        }

        function syncFromSearch() {
          var query = searchInput ? searchInput.value : "";

          if (normalizeSearchValue(query)) {
            renderSearchResults(query);
            return;
          }

          syncFromHash();
        }

        if (!data || !data.length) {
          return;
        }

        var linkIndex;

        for (linkIndex = 0; linkIndex < hashTargets.length; linkIndex += 1) {
          var link = hashTargets[linkIndex];

          link.addEventListener("click", function (event) {
            var slug = this.dataset.hashTarget;
            var isActive = this.classList.contains("is-active");

            event.preventDefault();

            if (slug === "overview") {
              if (window.location.hash) {
                window.location.hash = "monster-overview";
              }
              showOverview();
              return;
            }

            if (isActive) {
              window.location.hash = "monster-overview";
              showOverview();
              return;
            }

            window.location.hash = slug;
            syncFromHash();
          });
        }

        if (searchInput) {
          searchInput.addEventListener("input", syncFromSearch);
          searchInput.addEventListener("search", syncFromSearch);
        }

        syncFromHash();
        if (textFormatter.apply) {
          textFormatter.apply(document.body);
        }
        window.addEventListener("hashchange", syncFromHash);
      })();
    </script>
    <script src="script.js"></script>
  </body>
</html>
